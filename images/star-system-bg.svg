<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gStar" cx="42%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#FFFDE8"/>
      <stop offset="22%"  stop-color="#FFE540"/>
      <stop offset="60%"  stop-color="#FF8800"/>
      <stop offset="84%"  stop-color="#CC3E00"/>
      <stop offset="100%" stop-color="#761200"/>
    </radialGradient>
    <radialGradient id="gCorona" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="rgba(255,150,50,0)"/>
      <stop offset="78%"  stop-color="rgba(255,150,50,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,120,30,0)"/>
    </radialGradient>
    <radialGradient id="gP1" cx="34%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#C8E8FF"/>
      <stop offset="42%"  stop-color="#3E7FD0"/>
      <stop offset="100%" stop-color="#09185E"/>
    </radialGradient>
    <radialGradient id="gLava" cx="36%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#FFB050"/>
      <stop offset="38%"  stop-color="#FF2D00"/>
      <stop offset="80%"  stop-color="#880000"/>
      <stop offset="100%" stop-color="#360000"/>
    </radialGradient>
  </defs>

  <!-- No dark background rect — template overlay provides the dark tint -->

  <!-- Star field -->
  <g opacity="0.60">
    <circle cx="42"  cy="35"  r="1.1" fill="#fff" opacity="0.65"/>
    <circle cx="115" cy="78"  r="0.7" fill="#fff" opacity="0.50"/>
    <circle cx="198" cy="28"  r="1.0" fill="#fff" opacity="0.75"/>
    <circle cx="353" cy="44"  r="1.2" fill="#fff" opacity="0.60"/>
    <circle cx="565" cy="22"  r="1.0" fill="#fff" opacity="0.55"/>
    <circle cx="610" cy="64"  r="1.3" fill="#fff" opacity="0.65"/>
    <circle cx="762" cy="82"  r="1.1" fill="#fff" opacity="0.80"/>
    <circle cx="841" cy="18"  r="0.9" fill="#fff" opacity="0.60"/>
    <circle cx="912" cy="55"  r="0.8" fill="#fff" opacity="0.45"/>
    <circle cx="175" cy="182" r="1.0" fill="#fff" opacity="0.65"/>
    <circle cx="390" cy="514" r="1.1" fill="#fff" opacity="0.65"/>
    <circle cx="718" cy="522" r="1.0" fill="#fff" opacity="0.75"/>
    <circle cx="48"  cy="315" r="0.9" fill="#fff" opacity="0.45"/>
    <circle cx="948" cy="290" r="0.8" fill="#fff" opacity="0.50"/>
    <circle cx="928" cy="508" r="1.1" fill="#fff" opacity="0.60"/>
  </g>

  <!-- Orbit -->
  <ellipse cx="500" cy="280" rx="350" ry="88"
           fill="none" stroke="#8888BB"
           stroke-width="1.5" stroke-opacity="0.30"
           stroke-dasharray="8,7"/>

  <!-- Star corona -->
  <circle cx="500" cy="280" r="195" fill="url(#gCorona)"/>

  <!-- Star body -->
  <circle cx="500" cy="280" r="130" fill="url(#gStar)"/>

  <!-- Lava planet (left) -->
  <circle cx="150" cy="280" r="30" fill="rgba(255,60,0,0.10)"/>
  <circle cx="150" cy="280" r="22" fill="url(#gLava)"/>

  <!-- Exoplanet (right) -->
  <circle cx="850" cy="280" r="38"
          fill="rgba(70,150,255,0.10)"
          stroke="rgba(100,185,255,0.38)" stroke-width="2.5"/>
  <circle cx="850" cy="280" r="25" fill="url(#gP1)"/>
</svg>